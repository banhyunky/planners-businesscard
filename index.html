<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b5fa5">
<title>청호나이스 명함</title>
<link rel="preload" href="planners.json" as="fetch" crossorigin>
<style>
:root{--blue:#0b5fa5;--blue2:#1593c9;--ink:#17202b;--sub:#667385;--line:#e8edf3;--bg:#eef2f7;--orange:#ff7a1a}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;justify-content:center;padding:14px}
.wrap{width:100%;max-width:420px}
.card{background:#fff;border-radius:24px;box-shadow:0 10px 30px rgba(11,70,130,.14);overflow:hidden;visibility:hidden}
.card.show{visibility:visible}
.hero{background:linear-gradient(135deg,var(--blue),var(--blue2));padding:22px 22px 54px;color:#fff}
.logo-pill{display:inline-block;background:#fff;border-radius:12px;padding:6px 12px;line-height:0}
.logo-pill img{width:104px;height:42px}
.who{display:flex;align-items:center;gap:16px;margin:-34px 22px 0;position:relative}
.avatar{width:68px;height:68px;border-radius:50%;background:#fff;border:3px solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.15);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;color:var(--blue);flex:none}
.id{padding-top:34px}
.name{font-size:26px;font-weight:800;line-height:1.1}
.role{font-size:14px;color:var(--sub);margin-top:4px}
.tags{display:flex;flex-wrap:wrap;gap:6px;padding:18px 22px 4px}
.tag{font-size:12.5px;color:var(--blue);background:#eaf3fb;border-radius:999px;padding:5px 11px;font-weight:600}
.info{margin:14px 22px 0;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px}
.lab{font-size:12px;color:var(--sub);margin-bottom:2px}
.val{font-size:19px;font-weight:700}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px 22px 0}
.btn{display:flex;align-items:center;justify-content:center;height:52px;border-radius:14px;font-size:16px;font-weight:700;text-decoration:none;border:1px solid var(--line);color:var(--ink);background:#fff;cursor:pointer;font-family:inherit}
.btn.call{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn.wide{grid-column:1/3}
.btn:active{transform:scale(.98)}
.shop{display:flex;align-items:center;justify-content:center;height:60px;margin:14px 22px 24px;border-radius:16px;background:var(--orange);color:#fff;font-size:18px;font-weight:800;text-decoration:none;box-shadow:0 6px 16px rgba(255,122,26,.35)}
.msg{padding:48px 24px;text-align:center;line-height:1.7}
.msg b{display:block;font-size:18px;margin-bottom:8px}
.msg span{font-size:14px;color:var(--sub)}
.foot{text-align:center;font-size:12px;color:#97a3b3;margin:14px 0 4px}
</style>
</head>

      <div class="who">
        <div class="avatar" id="avatar"></div>
        <div class="id"><div class="name" id="name"></div><div class="role" id="role"></div></div>
      </div>
      <div class="tags">
        <span class="tag">정수기</span><span class="tag">공기청정기</span><span class="tag">매트리스</span><span class="tag">비데</span><span class="tag">렌탈 · 일시불</span><span class="tag">타사보상판매</span>

        <a class="btn call" id="call" href="#">전화하기</a>

        <button class="btn wide" id="save" type="button">연락처 저장</button>

    </div>

</main>
<script>
// 제품 사진 보기 이동 주소 (기존 쇼핑몰 chungho 저장소)
var SHOP_URL="https://banhyunky.github.io/chungho/";

(function(){
  function $(i){return document.getElementById(i)}
  var card=$("card");
  function fail(t,s){
    card.querySelector("#body").innerHTML='<div class="msg"><b>'+t+'</b><span>'+s+'</span></div>';
    card.classList.add("show");
  }
  var p=new URLSearchParams(location.search).get("p")||"";
  if(!p){fail("명함 정보를 찾을 수 없어요","QR 주소가 올바른지 확인하거나<br>담당 플래너에게 문의해 주세요.");return}

  fetch("planners.json").then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(all){
    var d=all[p];
    if(!d){fail("명함 정보를 찾을 수 없어요","QR 주소가 올바른지 확인하거나<br>담당 플래너에게 문의해 주세요.");return}
    var num=d.tel.replace(/[^0-9]/g,"");
    var org="청호나이스 "+(d.branch||"");
    $("avatar").textContent=d.name.charAt(0);
    $("name").textContent=d.name;
    $("role").textContent=d.role+(d.branch?" · "+org:"");
    $("foot").textContent=org;
    $("tel").textContent=d.tel;
    $("call").href="tel:"+num;
    $("sms").href="sms:"+num;
    $("shop").href=SHOP_URL+"?p="+encodeURIComponent(p);
    document.title=d.name+" "+d.role+" | 청호나이스";
    $("save").onclick=function(){
      var v="BEGIN:VCARD\nVERSION:3.0\nFN:"+d.name+" "+d.role+"\nN:"+d.name+";;;;\nORG:"+org+"\nTITLE:"+d.role+"\nTEL;TYPE=CELL:"+d.tel+"\nEND:VCARD";
      var a=document.createElement("a");
      a.href=URL.createObjectURL(new Blob([v],{type:"text/vcard;charset=utf-8"}));
      a.download=d.name+".vcf";
      document.body.appendChild(a);a.click();a.remove();
    };
    card.classList.add("show");
  }).catch(function(){
    fail("잠시 후 다시 시도해 주세요","명함 정보를 불러오지 못했어요.");
  });
})();
</script>
