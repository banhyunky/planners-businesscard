<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#EBF4FD">
<title>청호나이스 명함</title>
<link rel="preload" href="planners.json" as="fetch" crossorigin>
<style>
:root{--blue:#1D6CE0;--ink:#111827;--sub:#4B5563;--mute:#8A94A6;--line:#E6EDF5}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;background:#F2F4F7;color:var(--ink);min-height:100vh;display:flex;justify-content:center;padding:16px}
.wrap{width:100%;max-width:420px}
.card{background:#fff;border-radius:26px;border:1px solid var(--line);box-shadow:0 12px 32px rgba(15,35,65,.06);overflow:hidden;visibility:hidden}
.card.show{visibility:visible}
/* 상단 프로필 헤더 */
.hero{background:#EBF4FD;padding:18px 22px 0;display:flex;align-items:center;justify-content:space-between}
.hero img{height:34px;width:auto;display:block;border-radius:6px}
.share{height:32px;padding:0 13px;border-radius:999px;border:1px solid #D5E3F3;background:#fff;color:#1E4E8C;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer}
.profile{background:linear-gradient(180deg,#EBF4FD 0%,#F7FAFE 100%);border-bottom:1px solid #E2ECF7;padding:20px 22px 22px}
.avatar{display:none}
.nm{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.name{font-size:25px;font-weight:800;color:#111827;line-height:1.2;letter-spacing:-.3px}
.role{font-size:16px;font-weight:700;color:#1D6CE0}
.org{font-size:14px;font-weight:600;color:var(--sub);margin-top:6px}
.greet{font-size:14px;color:var(--sub);line-height:1.55;margin-top:10px;word-break:keep-all}
.tags{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:16px}
.tag{display:flex;align-items:center;justify-content:center;height:32px;padding:0 6px;border-radius:999px;background:#FFFFFF;border:1px solid #D5E3F3;color:#1E4E8C;font-size:12.5px;font-weight:600;white-space:nowrap}
/* 하단 액션 */
.actions{background:#fff;padding:18px 22px 22px}
.info{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#F8FAFC;border:1px solid #E8EEF5;border-radius:16px;padding:13px 14px 13px 16px}
.lab{font-size:12px;color:var(--mute);margin-bottom:2px}
.val{font-size:19px;font-weight:700;color:#111827;letter-spacing:.2px}
.mini{height:34px;padding:0 13px;border-radius:10px;border:1px solid #E2E8F0;background:#fff;color:#374151;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;flex:none}
.shop{display:flex;align-items:center;justify-content:center;height:56px;margin-top:14px;border-radius:14px;background:#1D6CE0;color:#fff;font-size:17px;font-weight:800;text-decoration:none;box-shadow:0 6px 16px rgba(29,108,224,.22)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.btn{display:flex;align-items:center;justify-content:center;height:50px;border-radius:14px;font-size:15.5px;font-weight:700;text-decoration:none;font-family:inherit;cursor:pointer;border:1px solid transparent}
.btn.soft{background:#EDF4FC;color:#185ABC}
.btn.line{background:#FFFFFF;color:#374151;border-color:#E2E8F0}
.btn:active,.shop:active,.mini:active,.share:active{transform:scale(.98)}
.msg{padding:48px 24px;text-align:center;line-height:1.7}
.msg b{display:block;font-size:18px;margin-bottom:8px}
.msg span{font-size:14px;color:var(--sub)}
.foot{text-align:center;font-size:12px;color:#97a3b3;margin:14px 0 4px}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(10px);background:#111827;color:#fff;font-size:14px;padding:10px 18px;border-radius:999px;opacity:0;transition:all .2s;pointer-events:none;white-space:nowrap;z-index:99}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>

<script>
// 복사 + 토스트 (리디자인 2026-11-17: 공유·번호 복사·명함 링크 복사 버튼)
function bcToast(m){var t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(function(){t.classList.remove("show")},2000)}
function bcCopy(text,m){
  function old(){var ta=document.createElement("textarea");ta.value=text;ta.style.cssText="position:fixed;opacity:0";document.body.appendChild(ta);ta.select();try{document.execCommand("copy")}catch(e){}ta.remove();bcToast(m)}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(function(){bcToast(m)},old)}else{old()}
}
</script>
<script>
// 제품 사진 보기 이동 주소 (기존 쇼핑몰 chungho 저장소)
var SHOP_URL="https://banhyunky.github.io/chungho/";

(function(){
  function $(i){return document.getElementById(i)}
  var card=$("card");
  function fail(t,s){
    card.querySelector("#body").innerHTML='<div class="msg"><b>'+t+'</b><span>'+s+'</span></div>';
    card.classList.add("show");
  }
  var p=new URLSearchParams(location.search).get("p")||"";
  if(!p){fail("명함 정보를 찾을 수 없어요","QR 주소가 올바른지 확인하거나<br>담당 플래너에게 문의해 주세요.");return}
  var LIVE_URL="https://script.google.com/macros/s/AKfycbyaQJ9M3MuYx6UXSbZOu4tt-Il2q8bEXkrHAcKv3CE1UpM_0U7bB_qXo8TSqUB6qbIt/exec";
  function liveLookup(){
    var ld=document.createElement("div");
    ld.textContent="명함을 불러오는 중이에요…";
    ld.style.cssText="position:fixed;left:0;right:0;top:40%;text-align:center;color:#667385;font-size:15px";
    document.body.appendChild(ld);
    return fetch(LIVE_URL).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(all){ld.remove();return all[p]||null},function(e){ld.remove();throw e});
  }

  fetch("planners.json").then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(all){
    return all[p]||liveLookup();
  }).then(function(d){
    if(!d){fail("명함 정보를 찾을 수 없어요","QR 주소가 올바른지 확인하거나<br>담당 플래너에게 문의해 주세요.");return}
    var num=d.tel.replace(/[^0-9]/g,"");
    var org="청호나이스 "+(d.branch||"");
    $("avatar").textContent=d.name.charAt(0);
    $("name").textContent=d.name;
    $("role").textContent=d.role+(d.branch?" · "+org:"");
    // 리디자인(2026-11-17): 직함은 이름 옆, 소속은 아래 줄에 따로 표시
    $("role").textContent=d.role;
    $("org").textContent=org;
    $("foot").textContent=org;
    $("tel").textContent=d.tel;
    $("call").href="tel:"+num;
    $("sms").href="sms:"+num;
    $("shop").href=SHOP_URL+"?p="+encodeURIComponent(p);
if(window.self!==window.top){$("shop").target="_blank";}
    document.title=d.name+" "+d.role+" | 청호나이스";
    $("save").onclick=function(){
      var v="BEGIN:VCARD\nVERSION:3.0\nFN:"+d.name+" "+d.role+"\nN:"+d.name+";;;;\nORG:"+org+"\nTITLE:"+d.role+"\nTEL;TYPE=CELL:"+d.tel+"\nEND:VCARD";
      var a=document.createElement("a");
      a.href=URL.createObjectURL(new Blob([v],{type:"text/vcard;charset=utf-8"}));
      a.download=d.name+".vcf";
      document.body.appendChild(a);a.click();a.remove();
    };
    card.classList.add("show");
  }).catch(function(){
    fail("잠시 후 다시 시도해 주세요","명함 정보를 불러오지 못했어요.");
  });
})();
</script>
</body>
</html>
